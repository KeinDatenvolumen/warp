plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'com.graphql-java:graphql-java-extended-scalars:24.0'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.graphql:spring-graphql-test'
    testImplementation 'org.springframework.boot:spring-boot-graphql-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

def graphqlContractDirectory = rootProject.file('contracts/graphql')

tasks.named('processResources') {
    from(graphqlContractDirectory) {
        include '*.graphqls'
        into 'graphql'
    }
}


tasks.withType(Test).configureEach {
    systemProperty(
            'warp.security.internal-service-token',
            'test-internal-service-token'
    )
}

tasks.named('test') {
    systemProperty(
            'warp.security.internal-service-token',
            'test-internal-service-token'
    )
}

springBoot {
    mainClass = 'de.warp.bff.BffServiceApplication'
}