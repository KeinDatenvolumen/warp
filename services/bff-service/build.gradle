plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'com.graphql-java:graphql-java-extended-scalars:24.0'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.graphql:spring-graphql-test'
    testImplementation 'org.springframework.boot:spring-boot-graphql-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

def graphqlContractDirectory = rootProject.file('contracts/graphql')

tasks.named('processResources') {
    from(graphqlContractDirectory) {
        include '*.graphqls'
        into 'graphql'
    }
}


tasks.withType(Test).configureEach {
    systemProperty(
            'warp.security.internal-service-token',
            'test-internal-service-token'
    )
}

tasks.named('test') {
    systemProperty(
            'warp.security.internal-service-token',
            'test-internal-service-token'
    )
}

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/dto/**',
                '**/entity/**',
                '**/*Config*',
                '**/*Properties*',
                '**/*Application*'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/dto/**',
                '**/entity/**',
                '**/*Config*',
                '**/*Properties*',
                '**/*Application*'
            ])
        }))
    }
    violationRules {
        // Kritische Optimierungs-Services / Controller (Refactoring Scope): Line >= 85%, Branch >= 80%, Complexity >= 75%
        rule {
            element = 'CLASS'
            includes = [
                'de.warp.bff.api.controller.RouteWeatherOptimizationController',
                'de.warp.bff.application.service.RouteWeatherOptimizationService'
            ]
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
            limit {
                counter = 'COMPLEXITY'
                value = 'COVEREDRATIO'
                minimum = 0.75
            }
        }

        // Maximale nicht abgedeckte Komplexität <= 10 für neu extrahierte Klasse & schlanken Controller
        rule {
            element = 'CLASS'
            includes = [
                'de.warp.bff.api.controller.RouteWeatherOptimizationController',
                'de.warp.bff.application.service.RouteWeatherOptimizationService'
            ]
            limit {
                counter = 'COMPLEXITY'
                value = 'MISSEDCOUNT'
                maximum = 10
            }
        }
    }
}

springBoot {
    mainClass = 'de.warp.bff.BffServiceApplication'
}