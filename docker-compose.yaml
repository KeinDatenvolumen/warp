name: warp

services:
  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    environment:
      PORT: "8081"
      WARP_INTERNAL_SERVICE_TOKEN: ${WARP_INTERNAL_SERVICE_TOKEN}
      WARP_DEV_TOKEN_ENABLED: "false"
    ports:
      - "8081:8081"
    restart: unless-stopped

  routing-service:
    build:
      context: .
      dockerfile: services/routing-service/Dockerfile
    environment:
      PORT: "8082"
      WARP_INTERNAL_SERVICE_TOKEN: ${WARP_INTERNAL_SERVICE_TOKEN}
      WARP_DEV_TOKEN_ENABLED: "false"
      MAPTILER_GEOCODING_API_KEY: ${MAPTILER_GEOCODING_API_KEY}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY}
    ports:
      - "8082:8082"
    restart: unless-stopped

  weather-service:
    build:
      context: .
      dockerfile: services/weather-service/Dockerfile
    environment:
      PORT: "8083"
      WARP_INTERNAL_SERVICE_TOKEN: ${WARP_INTERNAL_SERVICE_TOKEN}
      WARP_DEV_TOKEN_ENABLED: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
    ports:
      - "8083:8083"
    restart: unless-stopped

  storage-service:
    build:
      context: .
      dockerfile: services/storage-service/Dockerfile
    environment:
      PORT: "8084"
      WARP_INTERNAL_SERVICE_TOKEN: ${WARP_INTERNAL_SERVICE_TOKEN}
      WARP_DEV_TOKEN_ENABLED: "false"
    ports:
      - "8084:8084"
    restart: unless-stopped

  bff-service:
    build:
      context: .
      dockerfile: services/bff-service/Dockerfile
    environment:
      PORT: "8080"
      FRONTEND_URL: "http://localhost:5173"
      IDENTITY_SERVICE_URL: "http://identity-service:8081"
      ROUTING_SERVICE_URL: "http://routing-service:8082"
      WEATHER_SERVICE_URL: "http://weather-service:8083"
      STORAGE_SERVICE_URL: "http://storage-service:8084"
      WARP_INTERNAL_SERVICE_TOKEN: ${WARP_INTERNAL_SERVICE_TOKEN}
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - routing-service
      - weather-service
      - storage-service
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BFF_BASE_URL: "http://localhost:8080"
    environment:
      PORT: "8080"
    ports:
      - "5173:8080"
    depends_on:
      - bff-service
    restart: unless-stopped

  mpa:
    build:
      context: .
      dockerfile: mpa/Dockerfile
    environment:
      PORT: "8085"
      BFF_URL: "http://bff-service:8080"
      ROUTE_PLANNER_URL: "http://localhost:5173/route-planner"
    ports:
      - "8085:8085"
    depends_on:
      - bff-service
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.18.2
    environment:
      URLS: "[{url: '/specs/bff-service.yaml', name: 'BFF Service (Public REST API)'}, {url: '/specs/identity-service.yaml', name: 'Identity Service (Internal API)'}, {url: '/specs/routing-service.yaml', name: 'Routing Service (Internal API)'}, {url: '/specs/weather-service.yaml', name: 'Weather Service & MCP (Internal API)'}, {url: '/specs/storage-service.yaml', name: 'Storage Service (Internal API)'}]"
      URLS_PRIMARY_NAME: "BFF Service (Public REST API)"
    ports:
      - "8088:8080"
    volumes:
      - ./contracts/openapi:/usr/share/nginx/html/specs:ro
    restart: unless-stopped


