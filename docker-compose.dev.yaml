name: warp-dev

x-spring-service: &spring-service
  build:
    context: .
    dockerfile: infrastructure/docker/dev/Dockerfile.spring
  working_dir: /workspace
  init: true
  restart: unless-stopped

services:
  identity-service:
    <<: *spring-service
    environment:
      SERVICE_NAME: identity-service
      PORT: "8081"
      DB_URL: jdbc:postgresql://identity-db:5432/${IDENTITY_DB_NAME}?connectTimeout=2&socketTimeout=2&tcpKeepAlive=true
      DB_USERNAME: ${IDENTITY_DB_USER}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
    depends_on:
      identity-db:
        condition: service_healthy
    ports:
      - "8081:8081"
    volumes:
      - .:/workspace
      - identity-gradle-cache:/home/gradle/.gradle
      - identity-gradle-work:/workspace/.gradle
      - identity-build:/workspace/services/identity-service/build

  routing-service:
    <<: *spring-service
    environment:
      SERVICE_NAME: routing-service
      PORT: "8082"
      DB_URL: jdbc:postgresql://routing-db:5432/${ROUTING_DB_NAME}?connectTimeout=2&socketTimeout=2&tcpKeepAlive=true
      DB_USERNAME: ${ROUTING_DB_USER}
      DB_PASSWORD: ${ROUTING_DB_PASSWORD}
    depends_on:
      routing-db:
        condition: service_healthy
    ports:
      - "8082:8082"
    volumes:
      - .:/workspace
      - routing-gradle-cache:/home/gradle/.gradle
      - routing-gradle-work:/workspace/.gradle
      - routing-build:/workspace/services/routing-service/build

  weather-service:
    <<: *spring-service
    environment:
      SERVICE_NAME: weather-service
      PORT: "8083"
      DB_URL: jdbc:postgresql://weather-db:5432/${WEATHER_DB_NAME}?connectTimeout=2&socketTimeout=2&tcpKeepAlive=true
      DB_USERNAME: ${WEATHER_DB_USER}
      DB_PASSWORD: ${WEATHER_DB_PASSWORD}
    depends_on:
      weather-db:
        condition: service_healthy
    ports:
      - "8083:8083"
    volumes:
      - .:/workspace
      - weather-gradle-cache:/home/gradle/.gradle
      - weather-gradle-work:/workspace/.gradle
      - weather-build:/workspace/services/weather-service/build

  storage-service:
    <<: *spring-service
    environment:
      SERVICE_NAME: storage-service
      PORT: "8084"
      DB_URL: jdbc:postgresql://storage-db:5432/${STORAGE_DB_NAME}?connectTimeout=2&socketTimeout=2&tcpKeepAlive=true
      DB_USERNAME: ${STORAGE_DB_USER}
      DB_PASSWORD: ${STORAGE_DB_PASSWORD}
    depends_on:
      storage-db:
        condition: service_healthy
    ports:
      - "8084:8084"
    volumes:
      - .:/workspace
      - storage-gradle-cache:/home/gradle/.gradle
      - storage-gradle-work:/workspace/.gradle
      - storage-build:/workspace/services/storage-service/build

  bff-service:
    <<: *spring-service
    environment:
      SERVICE_NAME: bff-service
      PORT: "8080"
      FRONTEND_URL: "http://localhost:5173"
      IDENTITY_SERVICE_URL: "http://identity-service:8081"
      ROUTING_SERVICE_URL: "http://routing-service:8082"
      WEATHER_SERVICE_URL: "http://weather-service:8083"
      STORAGE_SERVICE_URL: "http://storage-service:8084"
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - routing-service
      - weather-service
      - storage-service
    volumes:
      - .:/workspace
      - bff-gradle-cache:/home/gradle/.gradle
      - bff-gradle-work:/workspace/.gradle
      - bff-build:/workspace/services/bff-service/build

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    working_dir: /app
    environment:
      VITE_BFF_PROXY_TARGET: "http://bff-service:8080"
      VITE_USE_POLLING: "true"
    init: true
    ports:
      - "5173:5173"
    depends_on:
      - bff-service
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

  identity-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME}
      POSTGRES_USER: ${IDENTITY_DB_USER}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD}
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - identity-db-data:/var/lib/postgresql
    restart: unless-stopped

  routing-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${ROUTING_DB_NAME}
      POSTGRES_USER: ${ROUTING_DB_USER}
      POSTGRES_PASSWORD: ${ROUTING_DB_PASSWORD}
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - routing-db-data:/var/lib/postgresql
    restart: unless-stopped

  storage-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${STORAGE_DB_NAME}
      POSTGRES_USER: ${STORAGE_DB_USER}
      POSTGRES_PASSWORD: ${STORAGE_DB_PASSWORD}
    ports:
      - "5437:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - storage-db-data:/var/lib/postgresql
    restart: unless-stopped

  weather-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${WEATHER_DB_NAME}
      POSTGRES_USER: ${WEATHER_DB_USER}
      POSTGRES_PASSWORD: ${WEATHER_DB_PASSWORD}
    ports:
      - "5436:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - weather-db-data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  bff-gradle-cache:
  identity-gradle-cache:
  routing-gradle-cache:
  weather-gradle-cache:
  storage-gradle-cache:

  bff-gradle-work:
  identity-gradle-work:
  routing-gradle-work:
  weather-gradle-work:
  storage-gradle-work:

  bff-build:
  identity-build:
  routing-build:
  weather-build:
  storage-build:

  frontend-node-modules:

  identity-db-data:
  routing-db-data:
  weather-db-data:
  storage-db-data: