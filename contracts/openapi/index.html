<!-- [KI-Log Nr. KI-25] KI-generiert (Google Antigravity (Gemini 3.8 Flash High)): Projekt-Dokumentation & QS -->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WaRP – OpenAPI 3.1 API Dokumentation (Swagger UI)</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .topbar-banner {
      background: #0f172a;
      color: #fff;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #38bdf8;
    }
    .topbar-banner h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar-banner .badge {
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .topbar-banner a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.15s;
    }
    .topbar-banner a:hover {
      color: #38bdf8;
    }
    /* Harmonize Swagger UI styling */
    .swagger-ui .topbar {
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .swagger-ui .info {
      margin: 24px 0 16px 0;
    }
  </style>
</head>
<body>
  <div class="topbar-banner">
    <h1>🧭 WaRP – Weather-aware Route Planning <span class="badge">OpenAPI 3.1</span></h1>
    <a href="../graphql/README.md" target="_blank">GraphQL Schema &rarr;</a>
  </div>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" crossorigin></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        urls: [
          { url: "./bff-service.yaml", name: "BFF Service (Public REST API - Port 8080)" },
          { url: "./identity-service.yaml", name: "Identity Service (Internal API - Port 8081)" },
          { url: "./routing-service.yaml", name: "Routing Service (Internal API - Port 8082)" },
          { url: "./weather-service.yaml", name: "Weather Service & MCP (Internal API - Port 8083)" },
          { url: "./storage-service.yaml", name: "Storage Service (Internal API - Port 8084)" }
        ],
        "urls.primaryName": "BFF Service (Public REST API - Port 8080)",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        docExpansion: "list",
        filter: true,
        showExtensions: true,
        showCommonExtensions: true,
        tryItOutEnabled: true
      });
    };
  </script>
</body>
</html>
