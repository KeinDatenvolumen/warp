spring:
  application:
    name: weather-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

warp:
  weather:
    open-meteo:
      base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com}
      connect-timeout: ${OPEN_METEO_CONNECT_TIMEOUT:2s}
      read-timeout: ${OPEN_METEO_READ_TIMEOUT:8s}
      maximum-locations-per-request: ${OPEN_METEO_MAX_LOCATIONS:50}
      forecast-hours: ${OPEN_METEO_FORECAST_HOURS:168}
      comparison-models: []

server:
  port: ${PORT:8083}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /internal
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true