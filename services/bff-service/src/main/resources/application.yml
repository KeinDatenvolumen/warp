spring:
  application:
    name: bff-service

  graphql:
    http:
      path: /graphql
    graphiql:
      enabled: false
    schema:
      inspection:
        enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

warp:
  graphql:
    test-error: ""

  security:
    internal-service-token: ${WARP_INTERNAL_SERVICE_TOKEN:local_internal_service_token_change_me}
    login-rate-limit:
      maximum-attempts: 5
      window: 60s
  session:
    duration: ${SESSION_DURATION:PT12H}
    mail:
      from: ${MAIL_FROM:no-reply@warp.local}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  services:
    identity:
      name: identity-service
      url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
    routing:
      name: routing-service
      url: ${ROUTING_SERVICE_URL:http://localhost:8082}
    weather:
      name: weather-service
      url: ${WEATHER_SERVICE_URL:http://localhost:8083}
    storage:
      name: storage-service
      url: ${STORAGE_SERVICE_URL:http://localhost:8084}
  health:
    connect-timeout: 2s
    read-timeout: 2s
  geocoding:
    connect-timeout: 2s
    read-timeout: 5s
  routing:
    connect-timeout: 2s
    read-timeout: 15s

management:
  endpoints:
    web:
      base-path: /internal
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true