spring:
  application:
    name: identity-service

  cache:
    type: caffeine
    cache-names:
      - session-lookups
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=5m

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      initialization-fail-timeout: -1

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS_ENABLED:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://localhost:5672}
    connection-timeout: 3s
    listener:
      simple:
        default-requeue-rejected: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas:
      - public
    validate-on-migrate: false
    ignore-migration-patterns:
      - "*:mismatched"


warp:
  security:
    internal-service-token: ${WARP_INTERNAL_SERVICE_TOKEN:local_internal_service_token_change_me}
  session:
    duration: ${SESSION_DURATION:PT12H}
  mail:
    from: ${MAIL_FROM:no-reply@warp.local}
  frontend:
    public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  messaging:
    enabled: ${WARP_MESSAGING_ENABLED:false}
    mail:
      max-attempts: 3
      retry-backoff: PT2S

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}]"

server:
  port: ${PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /internal
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    group:
      readiness:
        include:
          - readinessState
          - db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    rabbit:
      enabled: ${warp.messaging.enabled:false}