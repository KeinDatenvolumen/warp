name: Deploy Routing to Heroku

on:
  push:
    branches:
      - system/live
    paths:
      - "services/routing-service/**"
      - "services/bff-service/build.gradle"
      - "services/identity-service/build.gradle"
      - "services/weather-service/build.gradle"
      - "services/storage-service/build.gradle"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".dockerignore"
      - ".github/workflows/deploy-routing.yml"
      - ".github/workflows/reusable-heroku-container-deploy.yml"

  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/reusable-heroku-container-deploy.yml
    with:
      app_url: ${{ vars.HEROKU_ROUTING_URL }}
      app_name: ${{ vars.HEROKU_ROUTING_APP }}
      dockerfile: services/routing-service/Dockerfile
      image_name: warp-routing
      health_path: /internal/health/readiness
    secrets:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}