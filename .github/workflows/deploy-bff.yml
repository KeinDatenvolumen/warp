# [KI-Log Nr. KI-02] KI-generiert (Microsoft Copilot (GPT 5.6 Sol)): Monorepo-Setup, Gradle & Docker (WARP-001)
name: Deploy BFF to Heroku

on:
  push:
    branches:
      - system/live
    paths:
      - "services/bff-service/**"
      - "services/identity-service/build.gradle"
      - "services/routing-service/build.gradle"
      - "services/weather-service/build.gradle"
      - "services/storage-service/build.gradle"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".dockerignore"
      - ".github/workflows/deploy-bff.yml"
      - ".github/workflows/reusable-heroku-container-deploy.yml"

  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/reusable-heroku-container-deploy.yml
    with:
      app_url: ${{ vars.HEROKU_BFF_URL }}
      app_name: ${{ vars.HEROKU_BFF_APP }}
      dockerfile: services/bff-service/Dockerfile
      image_name: warp-bff
      health_path: /internal/health/readiness
    secrets:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}