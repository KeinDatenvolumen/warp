name: Reusable Heroku container deployment

on:
  workflow_call:
    inputs:
      app_name:
        description: Existing Heroku app name
        required: true
        type: string
      app_url:
        description: Public HTTPS URL of the Heroku app
        required: true
        type: string
      dockerfile:
        description: Dockerfile path relative to repository root
        required: true
        type: string
      image_name:
        description: Local Docker image name
        required: true
        type: string
      health_path:
        description: Path used for the post-deployment health check
        required: true
        type: string
      build_args:
        description: Optional Docker build arguments
        required: false
        default: ""
        type: string
    secrets:
      HEROKU_API_KEY:
        required: true
      MAPTILER_PUBLIC_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.app_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: live

    concurrency:
      group: live-${{ inputs.app_name }}
      cancel-in-progress: false

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Heroku CLI installieren
        shell: bash
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh
          heroku --version

      - name: Bei Heroku Container Registry anmelden
        shell: bash
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "$HEROKU_API_KEY" |
            docker login \
              --username=_ \
              --password-stdin \
              registry.heroku.com

      - name: Docker-Image bauen
        shell: bash
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          IMAGE_NAME: ${{ inputs.image_name }}
          BUILD_ARGS: ${{ inputs.build_args }}
          MAPTILER_PUBLIC_API_KEY: ${{ secrets.MAPTILER_PUBLIC_API_KEY }}
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        run: |
          if [ -n "$MAPTILER_PUBLIC_API_KEY" ]; then
            docker build \
              --platform linux/amd64 \
              --provenance=false \
              --file "$DOCKERFILE" \
              --tag "$IMAGE_NAME:${GITHUB_SHA}" \
              $BUILD_ARGS \
              --build-arg "VITE_MAPTILER_PUBLIC_API_KEY=$MAPTILER_PUBLIC_API_KEY" \
              .
          elif [ -n "$BUILD_ARGS" ]; then
            docker build \
              --platform linux/amd64 \
              --provenance=false \
              --file "$DOCKERFILE" \
              --tag "$IMAGE_NAME:${GITHUB_SHA}" \
              $BUILD_ARGS \
              .
          else
            docker build \
              --platform linux/amd64 \
              --provenance=false \
              --file "$DOCKERFILE" \
              --tag "$IMAGE_NAME:${GITHUB_SHA}" \
              .
          fi

      - name: Docker-Image prüfen
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          docker image inspect \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            --format 'ID={{.Id}} OS={{.Os}} ARCH={{.Architecture}}'
      
          docker image history \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            --no-trunc


      - name: Image für Heroku markieren
        shell: bash
        env:
          APP_NAME: ${{ inputs.app_name }}
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          docker tag \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            "registry.heroku.com/$APP_NAME/web"

      - name: Image zu Heroku übertragen
        shell: bash
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -o pipefail
      
          docker push \
            "registry.heroku.com/$APP_NAME/web" \
            2>&1 | tee /tmp/heroku-docker-push.log

      - name: Heroku Release durchführen
        shell: bash
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ inputs.app_name }}
        run: |
          heroku container:release web \
            --app "$HEROKU_APP_NAME"

      - name: Auf erfolgreichen Healthcheck warten
        shell: bash
        env:
          APP_URL: ${{ inputs.app_url }}
          HEALTH_PATH: ${{ inputs.health_path }}
        run: |
          BASE_URL="${APP_URL%/}"
          HEALTH_URL="${BASE_URL}${HEALTH_PATH}"

          echo "Pruefe $HEALTH_URL"

          for attempt in $(seq 1 20); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "$HEALTH_URL"; then
              echo
              echo "Healthcheck erfolgreich."
              exit 0
            fi

            echo
            echo "Versuch ${attempt}/20 fehlgeschlagen."
            sleep 10
          done

          echo "Healthcheck nach 20 Versuchen fehlgeschlagen."
          exit 1

      - name: Heroku-Logs bei Fehler anzeigen
        if: failure()
        shell: bash
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ inputs.app_name }}
        run: |
          heroku logs \
            --num 150 \
            --app "$HEROKU_APP_NAME" || true
