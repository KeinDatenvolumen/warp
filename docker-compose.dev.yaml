name: warp-dev

x-spring-service: &spring-service
  build:
    context: .
    dockerfile: infrastructure/docker/dev/Dockerfile.spring
  working_dir: /workspace
  init: true
  restart: unless-stopped
  volumes:
    - .:/workspace
    - gradle-cache:/home/gradle/.gradle

services:
  identity-service:
    <<: *spring-service
    environment:
      SERVICE_NAME: identity-service
      PORT: "8081"
    ports:
      - "8081:8081"
    volumes:
      - .:/workspace
      - gradle-cache:/home/gradle/.gradle
        - identity-gradle-work:/workspace/.gradle
      - identity-build:/workspace/services/identity-service/build

  routing-service:
    <<: *spring-service
    environment:
      SERVICE_NAME: routing-service
      PORT: "8082"
    ports:
      - "8082:8082"
    volumes:
      - .:/workspace
      - gradle-cache:/home/gradle/.gradle
        - routing-gradle-work:/workspace/.gradle
      - routing-build:/workspace/services/routing-service/build

  weather-service:
    <<: *spring-service
    environment:
      SERVICE_NAME: weather-service
      PORT: "8083"
    ports:
      - "8083:8083"
    volumes:
      - .:/workspace
      - gradle-cache:/home/gradle/.gradle
        - weather-gradle-work:/workspace/.gradle
      - weather-build:/workspace/services/weather-service/build

  storage-service:
    <<: *spring-service
    environment:
      SERVICE_NAME: storage-service
      PORT: "8084"
    ports:
      - "8084:8084"
    volumes:
      - .:/workspace
      - gradle-cache:/home/gradle/.gradle
        - storage-gradle-work:/workspace/.gradle
      - storage-build:/workspace/services/storage-service/build

  bff-service:
    <<: *spring-service
    environment:
      SERVICE_NAME: bff-service
      PORT: "8080"
      FRONTEND_URL: "http://localhost:5173"
      IDENTITY_SERVICE_URL: "http://identity-service:8081"
      ROUTING_SERVICE_URL: "http://routing-service:8082"
      WEATHER_SERVICE_URL: "http://weather-service:8083"
      STORAGE_SERVICE_URL: "http://storage-service:8084"
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - routing-service
      - weather-service
      - storage-service
    volumes:
      - .:/workspace
      - gradle-cache:/home/gradle/.gradle
        - bff-gradle-work:/workspace/.gradle
      - bff-build:/workspace/services/bff-service/build

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    environment:
      VITE_BFF_PROXY_TARGET: "http://bff-service:8080"
      VITE_USE_POLLING: "true"
    init: true
    ports:
      - "5173:5173"
    depends_on:
      - bff-service
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  gradle-cache:
  bff-gradle-work:
  identity-gradle-work:
  routing-gradle-work:
  weather-gradle-work:
  storage-gradle-work:
  bff-build:
  identity-build:
  routing-build:
  weather-build:
  storage-build:
  frontend-node-modules:
