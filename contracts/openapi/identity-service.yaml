openapi: 3.1.0
info:
  title: Identity Service Internal API – Benutzerkonto
  version: 1.0.0
  description: >
    Interner REST-Vertrag zum Lesen und Ändern des eigenen Benutzerkontos.
    Der Name ist nicht änderbar. Nach einer E-Mail-Änderung ist die Adresse
    unverifiziert und eine Bestätigungs-E-Mail geht an die neue Adresse.
servers:
  - url: http://identity-service:8081
    description: Interner Docker-/Cluster-Dienst

paths:
  /internal/v1/users/{userId}:
    get:
      summary: Benutzerdaten lesen
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Benutzerdaten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /internal/v1/users/{userId}/password-changes:
    post:
      summary: Passwort ändern
      operationId: changePassword
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Passwort wurde geändert
        '403':
          description: Aktuelles Passwort ist falsch (INVALID_PASSWORD)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '422':
          description: >
            PASSWORD_REQUIREMENTS_NOT_MET oder
            INVALID_ACCOUNT_CHANGE_REQUEST (z. B. PASSWORD_UNCHANGED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /internal/v1/users/{userId}/email-changes:
    post:
      summary: E-Mail-Adresse ändern
      operationId: changeEmail
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailRequest'
      responses:
        '204':
          description: >
            Adresse geändert, emailVerified ist false,
            Bestätigungs-E-Mail an die neue Adresse versendet
        '403':
          description: Passwort ist falsch (INVALID_PASSWORD)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: Adresse bereits vergeben (EMAIL_ALREADY_EXISTS)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: >
            INVALID_ACCOUNT_CHANGE_REQUEST (INVALID_EMAIL, EMAIL_UNCHANGED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  parameters:
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
  responses:
    UserNotFound:
      description: Benutzer existiert nicht (USER_NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    User:
      type: object
      required: [id, name, email, emailVerified, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 12 }
    ChangeEmailRequest:
      type: object
      required: [newEmail, password]
      properties:
        newEmail: { type: string }
        password: { type: string }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }