    plugins {
        id 'java'
        id 'org.springframework.boot'
        id 'io.spring.dependency-management'
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-flyway'
        implementation 'org.flywaydb:flyway-database-postgresql'

        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

        runtimeOnly 'org.postgresql:postgresql'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.boot:spring-boot-testcontainers'
        testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
        testImplementation 'org.testcontainers:testcontainers-postgresql'
        testImplementation 'org.wiremock:wiremock-standalone:3.13.2'

        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

springBoot {
    mainClass = 'de.warp.weather.WeatherServiceApplication'
}

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/dto/**',
                '**/entity/**',
                '**/*Config*',
                '**/*Properties*',
                '**/*Application*'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/dto/**',
                '**/entity/**',
                '**/*Config*',
                '**/*Properties*',
                '**/*Application*'
            ])
        }))
    }
    violationRules {
        // Subproject Weather-Service Gate: Line >= 80%, Branch >= 65%
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.65
            }
        }

        // Kritische Fachservices: Wetter-Scoring (Branch >= 80%, Complexity >= 75%)
        rule {
            element = 'CLASS'
            includes = [
                'de.warp.weather.application.WeatherScoringService',
                'de.warp.weather.application.scoring.OptimizationScoringRules',
                'de.warp.weather.application.hazard.WeatherHazardDetector'
            ]
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
            limit {
                counter = 'COMPLEXITY'
                value = 'COVEREDRATIO'
                minimum = 0.75
            }
        }

        // Kritische Fachservices: Cache (Branch >= 80%, Complexity >= 75%)
        rule {
            element = 'CLASS'
            includes = [
                'de.warp.weather.application.WeatherCacheService',
                'de.warp.weather.application.cache.CacheFreshnessPolicy'
            ]
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
            limit {
                counter = 'COMPLEXITY'
                value = 'COVEREDRATIO'
                minimum = 0.75
            }
        }

        // Kritische Fachservices: Optimierung (Branch >= 80%, Complexity >= 75%)
        rule {
            element = 'CLASS'
            includes = [
                'de.warp.weather.application.RouteWeatherOptimizationService',
                'de.warp.weather.application.slot.DepartureSlotGenerator'
            ]
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
            limit {
                counter = 'COMPLEXITY'
                value = 'COVEREDRATIO'
                minimum = 0.75
            }
        }

        // Geänderte / Neue Klassen: Line >= 85%, Branch >= 75%
        rule {
            element = 'CLASS'
            includes = [
                'de.warp.weather.application.scoring.OptimizationScoringRules',
                'de.warp.weather.application.cache.CacheFreshnessPolicy',
                'de.warp.weather.application.hazard.WeatherHazardDetector',
                'de.warp.weather.application.slot.DepartureSlotGenerator',
                'de.warp.weather.application.ai.WeatherAiResponseValidator',
                'de.warp.weather.application.ai.WeatherAiResultMapper'
            ]
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.75
            }
        }

        // Maximale nicht abgedeckte Komplexität <= 10 für neue/geänderte Fachklassen
        rule {
            element = 'CLASS'
            includes = [
                'de.warp.weather.application.scoring.OptimizationScoringRules',
                'de.warp.weather.application.cache.CacheFreshnessPolicy',
                'de.warp.weather.application.hazard.WeatherHazardDetector',
                'de.warp.weather.application.slot.DepartureSlotGenerator',
                'de.warp.weather.application.ai.WeatherAiPromptBuilder',
                'de.warp.weather.application.ai.WeatherAiResponseValidator',
                'de.warp.weather.application.ai.WeatherAiResultMapper'
            ]
            limit {
                counter = 'COMPLEXITY'
                value = 'MISSEDCOUNT'
                maximum = 10
            }
        }
    }
}
