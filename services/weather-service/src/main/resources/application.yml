spring:
  application:
    name: weather-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas:
      - public

warp:
  weather:
    open-meteo:
      base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com}
      connect-timeout: ${OPEN_METEO_CONNECT_TIMEOUT:2s}
      read-timeout: ${OPEN_METEO_READ_TIMEOUT:8s}
      maximum-locations-per-request: ${OPEN_METEO_MAX_LOCATIONS:50}
      forecast-hours: ${OPEN_METEO_FORECAST_HOURS:168}
      comparison-models: []
    cache:
      ttl: ${WEATHER_CACHE_TTL:60m}
    scoring:
      score-version: ${WEATHER_SCORE_VERSION:2.0}
      wind-weight: ${WEATHER_WIND_WEIGHT:0.30}
      precipitation-weight: ${WEATHER_PRECIPITATION_WEIGHT:0.45}
      thunderstorm-weight: ${WEATHER_THUNDERSTORM_WEIGHT:0.25}
      thunderstorm-risk-threshold-percent: ${WEATHER_THUNDERSTORM_THRESHOLD_PERCENT:50.0}
      thunderstorm-max-overall-score: ${WEATHER_THUNDERSTORM_MAX_SCORE:50}
    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash}
      fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-3.6-flash}
      connect-timeout: ${GEMINI_CONNECT_TIMEOUT:3s}
      read-timeout: ${GEMINI_READ_TIMEOUT:20s}
      temperature: ${GEMINI_TEMPERATURE:0.2}

server:
  port: ${PORT:8083}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /internal
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
