spring:
  application:
    name: routing-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /internal
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    group:
      readiness:
        include:
          - readinessState
          - db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

warp:
  geocoding:
    maptiler:
      base-url: ${MAPTILER_GEOCODING_BASE_URL:https://api.maptiler.com}
      api-key: ${MAPTILER_GEOCODING_API_KEY:}
      connect-timeout: 2s
      read-timeout: 5s

  routing:
    openrouteservice:
      base-url: ${OPENROUTESERVICE_BASE_URL:https://api.heigit.org}
      api-key: ${OPENROUTESERVICE_API_KEY:}
      connect-timeout: 2s
      read-timeout: 10s