spring:
  application:
    name: storage-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas:
      - public
    validate-on-migrate: false
    ignore-migration-patterns:
      - "*:mismatched"

warp:
  security:
    internal-service-token: ${WARP_INTERNAL_SERVICE_TOKEN:local_internal_service_token_change_me}

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}]"

server:
  port: ${PORT:8084}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /internal
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true